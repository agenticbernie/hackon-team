name: hackon-team

services:
  web:
    # Plain runtime image, never a prebuilt app image: the repo is bind-mounted
    # and served by `next dev`, so source edits show up without a rebuild.
    image: node:22-alpine
    working_dir: /app
    restart: on-failure
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      # Keep dependencies and the Next build cache out of the bind mount so the
      # repo stays clean.
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    environment:
      - NEXT_TELEMETRY_DISABLED=1
      # Bind mounts do not propagate inotify events reliably; poll instead.
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      # Passed through from the platform environment. BASE44_PREVIEW_MODE gates
      # the sandbox-only dev-origin allowlist in next.config.mjs;
      # BASE44_PUBLIC_HOST_SUFFIX builds the preview origin it allows.
      - BASE44_PREVIEW_MODE
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
    # Install from the committed lockfile on every start, then run the dev
    # server bound to all interfaces (the preview proxy reaches it from outside
    # the container).
    command:
      - sh
      - -ec
      - npm ci --no-audit --no-fund && exec npm run dev -- --hostname 0.0.0.0 --port 3000
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 90s

volumes:
  node_modules:
  next_cache:
