# Base44 sandbox compose — runs the Astro app from the cloned source with hot
# reload. Not a production deployment file.
services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
      # Keep container-installed dependencies out of the host checkout.
      - node_modules:/app/node_modules
    command:
      - sh
      - -ec
      - |
        if [ -f package-lock.json ]; then
          npm ci --no-audit --no-fund
        else
          npm install --no-audit --no-fund
        fi
        exec npm run dev
    ports:
      - "3000:3000"
    environment:
      # Preview mode flag + host/origin values are provided by the platform.
      - BASE44_PREVIEW_MODE
      - BASE44_SANDBOX_HOST_DOMAIN
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: on-failure

volumes:
  node_modules:
